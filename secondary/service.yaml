apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: better-uptime-secondary
  labels:
    app: frontend
spec:
  type: NodePort
  ports:
  - name: frontend-port
    port: 6000
    targetPort: 80
    protocol: TCP
  selector:
    app: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: better-uptime-secondary
  labels:
    app: backend
spec:
  type: NodePort
  ports:
  - name: backend-port
    port: 6001
    targetPort: 80
    protocol: TCP
  selector:
    app: backend